# Nginx na frente do ERP: responde na porta 80/443 e repassa para o Node na 3000.
# Instalar em /etc/nginx/sites-available/argamassas-erp e criar o link em sites-enabled.
# Troque SEU_DOMINIO pelo dominio de verdade antes de usar.

server {
    listen 80;
    listen [::]:80;
    server_name SEU_DOMINIO;

    # O certbot cuida do redirecionamento para HTTPS depois de emitir o certificado.
    client_max_body_size 12M;   # comprovantes enviados pelo celular

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
